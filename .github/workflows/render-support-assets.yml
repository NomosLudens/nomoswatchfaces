name: Render NOMOS complementary assets
on:
  push:
    paths:
      - 'tools/render_support_assets.py'
      - '.github/workflows/render-support-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render and validate NOMOS support assets
        run: python tools/render_support_assets.py
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/separators assets/battery assets/date assets/support/preview.png dist/NOMOS_FACE_01_COMPLEMENTOS.zip
          if ! git diff --cached --quiet; then
            git commit -m "assets: renderizar complementos NOMOS 01"
            git push
          fi