name: Render HAR glyph assets
on:
  push:
    paths:
      - 'assets/har/har.svg'
      - 'tools/render_har.py'
      - '.github/workflows/build-har-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  har:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render transparent HAR images
        run: python tools/render_har.py
      - name: Commit generated glyph PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/har/har_64.png assets/har/har_128.png assets/har/har_256.png assets/har/har_390.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: export HAR glyph in transparent PNG sizes"
            git push
          fi
