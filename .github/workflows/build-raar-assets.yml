name: Render RAAR glyph assets
on:
  push:
    paths:
      - 'assets/raar/raar.svg'
      - 'tools/render_raar.py'
      - '.github/workflows/build-raar-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  raar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
      - name: Render transparent RAAR images
        run: python tools/render_raar.py
      - name: Commit generated glyph PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raar/raar_64.png assets/raar/raar_128.png assets/raar/raar_256.png assets/raar/raar_390.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: export RAAR glyph in transparent PNG sizes"
            git push
          fi
